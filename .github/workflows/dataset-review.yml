name: 오픈 데이터셋 법적 리스크 검토

on:
  issues:
    types: [opened, labeled]

# 같은 이슈의 실행을 직렬화하되, 진행 중인 실행은 절대 취소하지 않는다.
#  ⚠️ cancel-in-progress: true 였을 때, 템플릿 이슈 생성 시 거의 동시에 오는
#     opened / labeled 이벤트 중 나중의 labeled run 이 concurrency 그룹에 들어오며
#     검토를 수행하던 opened run 을 취소했고, 정작 labeled run 은 아래 if 조건
#     (rerun-review 만 허용)에 걸려 skip 되어 → 어떤 검토도 실행되지 않고 이슈가
#     영구 "대기" 상태로 남는 버그가 있었다. labeled(dataset-review) 는 항상 skip
#     되어 이중 호출 위험이 없으므로 취소가 불필요하다. false 로 두어 opened run 이
#     끝까지 검토를 마치도록 한다.
concurrency:
  group: dataset-review-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  review:
    # 검토 실행 조건 (누구나 사용 가능 — 작성자 권한 제한 없음):
    #  1) 'dataset-review' 라벨이 있는 이슈만 검토.
    #  2) 작성자 권한(author_association) 검사는 하지 않는다. 외부인(NONE)이 연
    #     이슈도 자동으로 검토가 실행된다. (누구나 접근·사용 가능하도록 개방)
    #     ⚠️ 참고: 이 개방으로 외부인의 무분별한 이슈가 Gemini 무료 쿼터를 소진할
    #        수 있다. 필요 시 이전의 작성자/승인(review-approved) 게이트를 복구할 것.
    #  3) 이벤트별로 정확히 한 번만 실행:
    #     - opened: 신규 이슈이고 아직 'reviewed' 가 아닐 때 1회.
    #     - labeled: 'rerun-review'(재검토)가 새로 붙었을 때만 실행. (워크플로 자신이
    #       붙이는 reviewing/reviewed 라벨은 제외되어 자기 재트리거를 막는다.)
    if: >
      contains(github.event.issue.labels.*.name, 'dataset-review') &&
      ( ( github.event.action == 'opened' &&
          !contains(github.event.issue.labels.*.name, 'reviewed') ) ||
        ( github.event.action == 'labeled' &&
          github.event.label.name == 'rerun-review' ) )
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 검토 시작 알림
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "reviewing" --repo "$GITHUB_REPOSITORY" || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "🤖 자동 법적 리스크 검토를 시작합니다. 잠시만 기다려 주세요 (보통 1~3분 소요)."

      - name: 법적 리스크 검토 실행
        id: run_review
        env:
          # secrets 컨텍스트 전체를 toJson()으로 넘기면 GitHub가 워크플로를 실행 전에
          # action_required로 거부한다. 지원하는 키를 명시적으로 매핑해야 labeled 이벤트가
          # 실제 job을 만들고 rerun-review 결과를 이슈에 게시할 수 있다.
          #  ⚠️ 새 키 추가 시: 여기에 `<변수명>: ${{ secrets.<변수명> }}` 한 줄을 추가하고,
          #     prompt-book/gemini-api-keys.json 의 'order' 에도 그 이름을 넣어야 한다.
          #     (시도 '순서'는 그 JSON 파일이 단일 출처. 파일이 없으면 이름 알파벳순으로 폴백.)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_AIGOVSENSING: ${{ secrets.GEMINI_API_KEY_AIGOVSENSING }}
          GEMINI_API_KEY_AITSEC2025: ${{ secrets.GEMINI_API_KEY_AITSEC2025 }}
          GEMINI_API_KEY_GEUNSIKLIM: ${{ secrets.GEMINI_API_KEY_GEUNSIKLIM }}
          GEMINI_API_KEY_LEEMGS: ${{ secrets.GEMINI_API_KEY_LEEMGS }}
          # (선택) Gemini 내장 그라운딩 전부 실패 시 Google Programmable Search JSON API로
          # 검색 결과를 수집해 PLAIN 최후 폴백을 보강한다. 둘 중 하나라도 없으면 검색 없는
          # 기존 PLAIN 폴백으로 동작한다.
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ vars.GOOGLE_SEARCH_ENGINE_ID || '' }}
          GOOGLE_SEARCH_MAX_QUERIES: ${{ vars.GOOGLE_SEARCH_MAX_QUERIES || '3' }}
          # 기본(1차) 검토 모델. 저장소 변수 vars.GEMINI_DEFAULT_MODEL 이 없으면 최신 Flash 별칭.
          # (특정 버전 고정은 이 변수로 지정.)
          GEMINI_DEFAULT_MODEL: ${{ vars.GEMINI_DEFAULT_MODEL || 'gemini-flash-latest' }}
          # (선택) 하이브리드 2패스: vars.GEMINI_WRITER_MODEL 을 지정하면 1차로 그라운딩
          # 가능한 모델(무료 티어는 2.5)로 웹검색 근거·출처를 수집한 뒤, 그 근거를 이 모델
          # (예: gemini-3.7-flash)에 넘겨 그라운딩 없이 최종 검토문을 작성한다. 무료 티어에서
          # 3.x 품질 + 출처 링크를 동시에 얻는다. 미설정 시 기존 단일 패스 동작 그대로.
          # 팁: 하이브리드 사용 시 vars.GEMINI_DEFAULT_MODEL 을 gemini-2.5-flash 로 두면 1차 그라운딩이
          #     곧장 2.5 로 가 무의미한 3.x 그라운딩 429 캐스케이드가 사라진다.
          GEMINI_WRITER_MODEL: ${{ vars.GEMINI_WRITER_MODEL || '' }}
          # 검토 결과 상단에 표시할 '서비스 티어' 라벨(선택, 표시용일 뿐 동작엔 무관).
          # 미설정('') 시 스크립트가 API 응답으로 자동 판별하고, 그래도 없으면 기본값 Free.
          GEMINI_SERVICE_TIER: ${{ vars.GEMINI_SERVICE_TIER || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REVIEW_OUTPUT: review.md
        run: python scripts/dataset_review.py
        continue-on-error: true

      - name: 검토 결과 이슈 댓글 등록
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file review.md

      - name: 라벨 정리
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEW_OUTCOME: ${{ steps.run_review.outcome }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "reviewing" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "rerun-review" || true
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "reviewed" || true
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "review-failed" || true
          fi

      - name: 검토 실패 시 run 을 실패로 표시
        # 위 단계에서 실패 사유는 이미 이슈 댓글과 review-failed 라벨로 남긴다.
        # 여기서 잡을 실패시켜, 검토가 실패했는데도 run 이 초록색(success)으로
        # 보이는 오해를 방지한다.
        if: steps.run_review.outcome != 'success'
        run: |
          echo "::error::법적 리스크 검토 실행이 실패했습니다. 이슈 댓글의 오류 메시지를 확인하세요."
          exit 1
