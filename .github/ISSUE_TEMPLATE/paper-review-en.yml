name: Legal risk review request (research paper) — English
description: Request an automated legal review (personal information, copyright, dataset verification) of a research paper (PDF or web page). The result is posted in English.
title: "[Paper Review] "
labels: ["paper-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Research paper legal pre-review request
        Enter a paper PDF or the URL of the web page where the paper is published and the automated review agent
        (Gemini) will review **① personal information · ② copyright · ③ dataset verification** based on the
        paper itself, then post the result as a comment on this issue — **in English** (the Korean original is
        included in a collapsed section).

        > This review is a reference for internal pre-screening of risk and does not replace legal advice.
  - type: input
    id: paper-title
    attributes:
      label: Paper title
      description: Title of the paper to review (optional — taken from the paper if left empty)
      placeholder: e.g. Deep Residual Learning for Image Recognition
    validations:
      required: false
  - type: textarea
    id: paper-url
    attributes:
      label: Paper PDF / website URL
      description: >
        Enter a direct link to the paper PDF (recommended) or the URL of the web page where the paper is published.
        For arXiv, both abs and pdf links work. PDFs are read directly; web pages are read and reviewed.
      placeholder: |
        https://arxiv.org/pdf/1512.03385
        https://arxiv.org/abs/1512.03385
        https://openreview.net/forum?id=...
    validations:
      required: true
  - type: dropdown
    id: system-prompt
    attributes:
      label: Select system prompt
      description: Choose the system prompt used for the review. Prompt options added in the future can be selected here.
      options:
        - "Base"
        - "None"
        - "Heejin"
      default: 0
  - type: textarea
    id: extra-notes
    attributes:
      label: Description
      description: Anything special or any request to take into account in the review.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        When you submit, the `paper-review` label is applied automatically and the review starts.
        A review usually takes 1–3 minutes.
