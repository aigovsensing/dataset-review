name: 연구논문 법무 검토 요청
description: 연구논문(PDF 또는 웹페이지)의 개인정보·저작권·데이터셋 법무 리스크 자동 검토를 요청합니다.
title: "[논문검토] "
labels: ["paper-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## 연구논문 법무 사전 검토(Legal Review) 요청
        논문 PDF 또는 논문이 등재된 웹페이지 URL 을 입력하면 자동 검토 에이전트(Gemini)가
        **① 개인정보 · ② 저작권 · ③ 데이터셋 검증** 을 논문 원문 기반으로 검토하여
        이 이슈에 결과를 댓글로 등록합니다.

        > 본 검토는 회사 내부 사전 리스크 검토용 참고 자료이며, 법률 자문을 대체하지 않습니다.
  - type: input
    id: paper-title
    attributes:
      label: 논문 제목
      description: 검토할 논문의 제목(선택 — 미입력 시 원문에서 확인)
      placeholder: 예) Deep Residual Learning for Image Recognition
    validations:
      required: false
  - type: textarea
    id: paper-url
    attributes:
      label: 논문 PDF / 웹사이트 URL
      description: >
        논문 PDF 직접 링크(권장) 또는 논문이 등재된 웹페이지 URL 을 입력합니다.
        arXiv 는 abs/pdf 링크 모두 가능합니다. PDF 는 원문을 직접 판독하고, 웹페이지는 페이지를 읽어 검토합니다.
      placeholder: |
        https://arxiv.org/pdf/1512.03385
        https://arxiv.org/abs/1512.03385
        https://openreview.net/forum?id=...
    validations:
      required: true
  - type: textarea
    id: extra-notes
    attributes:
      label: 추가 참고 사항
      description: 검토 시 참고할 특이사항이나 요청사항이 있다면 입력합니다.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        제출하면 자동으로 `paper-review` 라벨이 부여되고 검토가 시작됩니다.
        검토에는 보통 1~3분이 소요됩니다.
